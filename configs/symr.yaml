# Model arguments
model_name_or_path: "deepseek-ai/DeepSeek-Prover-V1.5-SFT"   #deepseek-ai/DeepSeek-Prover-V1.5-SFT, openai-community/gpt2
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2
trust_remote_code: true
# Data training arguments
dataset_name: workbook
dataset_split: train
preprocessing_num_workers: 24

# SFT trainer config
bf16: true
do_eval: false
tf32: true
torch_compile: true
optim: paged_adamw_8bit
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true
hub_model_id: Minsukim/deepseek_CUSTOM_GRPO_workbookdata
output_dir: /projects/minsu/ATP_checkpoints/deepseek_CUSTOM_GRPO_workbookdata

log_level: info
logging_steps: 10
logging_strategy: steps
lr_scheduler_type: cosine
max_steps: -1
num_train_epochs: 1
overwrite_output_dir: true
per_device_train_batch_size: 8
remove_unused_columns: true
report_to:
- tensorboard
- wandb


#resume_from_checkpoint: true

save_strategy: "steps"
save_steps: 100
save_total_limit: 2



seed: 42
warmup_ratio: 0.1
use_peft: true
load_in_4bit: false
load_in_8bit: false
lora_r: 16
lora_alpha: 16



beta: 0.04
learning_rate: 1.0e-05
temperature: 0.9

# GRPO default setting
reward_type: 'lean'

num_generations: 4
num_iterations: 2
use_vllm: true
vllm_gpu_memory_utilization: 0.5
loss_function: "grpo"
token_level_kl: true
normalize_advantage: true
kl_coef: true
cliprange: 0.2
whiten_rewards: false


max_completion_length: 2048 #gpt2: 256, others: 2048


negative_dropout : true
dropout_rate: 0.5

# Hub
push_to_hub: true
hub_private_repo: true
wandb_project: ATP
wandb_entity: kimminsu
