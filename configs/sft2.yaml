# Model arguments
model_name_or_path: deepseek-ai/DeepSeek-Prover-V1.5-SFT  #deepseek-ai/DeepSeek-Prover-V2-7B  #openai-community/gpt2
model_revision: main
torch_dtype: bf16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: stp
dataset_split: train
preprocessing_num_workers: 48

# SFT trainer config
bf16: true
do_eval: false
tf32: true
torch_compile: true
optim: paged_adamw_8bit
gradient_accumulation_steps: 16
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: False
hub_model_id: Minsukim/DeepSeek-Prover-V1.5-7B_sft_stp_500k
output_dir: /projects/minsu/ATP_checkpoints/DeepSeek-Prover-V1.5-7B_sft_stp_500k
learning_rate: 1.0e-05
log_level: info
logging_steps: 5
logging_strategy: steps
lr_scheduler_type: cosine
max_length: 2048    #2048
max_steps: -1
num_train_epochs: 1
overwrite_output_dir: true
per_device_train_batch_size: 8
remove_unused_columns: true
trust_remote_code: true
report_to:
- tensorboard
- wandb
save_strategy: "epoch"
seed: 42
warmup_ratio: 0.1


# Hub
push_to_hub: true
hub_private_repo: true