# Model arguments
model_name_or_path: "openai-community/gpt2" #kfdong/STP_model_Lean_0320  Minsukim/internlm_1_8_sft_bf16 #openai-community/gpt2 deepseek-ai/DeepSeek-Prover-V1.5-SFT
base_model_name_or_path: "openai-community/gpt2"
model_revision: main
torch_dtype: bf16
attn_implementation: flash_attention_2
trust_remote_code: true
# Data training arguments
dataset_name: stp
dataset_split: train
preprocessing_num_workers: 24

# SFT trainer config
bf16: true
do_eval: false
tf32: true
torch_compile: false
optim: paged_adamw_8bit   #adamw_torch_fused
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: False
per_device_train_batch_size: 1
hub_model_id:
output_dir: /projects/minsu/ATP_checkpoints/test


log_level: info
logging_steps: 10
logging_strategy: steps

save_strategy: "no"    #rloo: "no"
save_steps: 400
save_total_limit: 1
hub_strategy: "end"



#resume_from_checkpoint: true
learning_rate: 1.0e-05    #4.0e-07  1.0e-05
temperature: 0.9


lr_scheduler_type: cosine
max_steps: -1
#num_train_epochs: 1
total_episodes: 20000
num_ppo_epochs: 2
overwrite_output_dir: true
remove_unused_columns: true
report_to:
- tensorboard
- wandb
seed: 42
warmup_ratio: 0.1

#rloo
vllm_gpu_memory_utilization: 0.5
local_rollout_forward_batch_size: 4   #should be same as rloo_k
local_mini_batch_size: 4 #should be same as rloo_k
max_prompt_length: 512
response_length: 1024 #gpt2: 256, others: 2048
rloo_k: 4
num_sample_generations: 0
negative_dropout : false
dropout_rate: 0.5

#token_level_kl: true

train_method: "rloo"
alpha_advantage: 1
delta1: -0.05
delta2: -0.1
adv_baseline: "group"
score_assign: "all"  #last ,all
adv_method: "label"    #return or label
parse_method: "tree"
weighted_adv: false
first_error: true


use_peft: true
load_in_4bit: false
load_in_8bit: false
lora_r: 64
lora_alpha: 64
lora_target_modules: all-linear


# Hub
push_to_hub: true
hub_private_repo: true
#wandb_project: ATP
wandb_entity: kimminsu
