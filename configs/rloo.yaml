# Model arguments
model_name_or_path: "deepseek-ai/DeepSeek-Prover-V1.5-SFT" #Minsukim/internlm_1_8_sft #openai-community/gpt2 deepseek-ai/DeepSeek-Prover-V1.5-SFT
model_revision: main
torch_dtype: bf16
attn_implementation: flash_attention_2
trust_remote_code: true
# Data training arguments
dataset_name: workbook
dataset_split: train
preprocessing_num_workers: 24

# SFT trainer config
bf16: true
do_eval: false
tf32: true
torch_compile: false
optim: paged_adamw_8bit
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: False
per_device_train_batch_size: 2
hub_model_id: Minsukim/deepseek_RLOO_baseline_workbookdata
output_dir: /projects/minsu/ATP_checkpoints/deepseek_RLOO_baseline_workbookdata

log_level: info
logging_steps: 10
logging_strategy: steps

save_strategy: "steps"
save_steps: 100
save_total_limit: 2

#resume_from_checkpoint: true
learning_rate: 1.0e-05    #4.0e-07  1.0e-05
temperature: 0.9


lr_scheduler_type: cosine
max_steps: -1


total_episodes: 15000
#num_train_epochs: 1


overwrite_output_dir: true
remove_unused_columns: true
report_to:
- tensorboard
- wandb
seed: 42
warmup_ratio: 0.1

#rloo
local_rollout_forward_batch_size: 4   #should be same as rloo_k
local_mini_batch_size: 4 #should be same as rloo_k
response_length: 1024 #gpt2: 256, others: 2048
rloo_k: 4
num_sample_generations: 0

use_peft: true
load_in_4bit: false
load_in_8bit: false
lora_r: 16
lora_alpha: 16



# Hub
push_to_hub: true
hub_private_repo: true
wandb_project: ATP
wandb_entity: kimminsu
