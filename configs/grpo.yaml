# Model arguments
model_name_or_path: "deepseek-ai/DeepSeek-Prover-V1.5-SFT" #deepseek-ai/deepseek-coder-1.3b-base
model_revision: main
torch_dtype: bf16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: minif2f
dataset_split: train
preprocessing_num_workers: 24

# SFT trainer config
bf16: true
do_eval: false
tf32: true
torch_compile: true
optim: paged_adamw_8bit
gradient_accumulation_steps: 16
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true
hub_model_id:
output_dir: ./
learning_rate: 1.0e-05
log_level: info
logging_steps: 5
logging_strategy: steps
lr_scheduler_type: cosine
max_steps: -1
num_train_epochs: 3
overwrite_output_dir: true
per_device_train_batch_size: 4
remove_unused_columns: true
report_to:
- tensorboard
- wandb
save_strategy: "epoch"
seed: 42
warmup_ratio: 0.1
num_generations: 4
num_iterations: 1
use_vllm: true
vllm_gpu_memory_utilization: 0.5
use_peft: true
load_in_4bit: false
load_in_8bit: false
lora_r: 16




# Hub
push_to_hub: false
hub_private_repo: true