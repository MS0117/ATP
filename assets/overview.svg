  <rect x="178" y="224" width="66" height="48" rx="9" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="211" y="256" font-size="21" font-weight="700" text-anchor="middle" fill="#1f2328">Y</text>
