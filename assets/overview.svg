  <text x="1120" y="210" font-size="16" text-anchor="middle" fill="#30363d">whole-proof correctness verified by Lean</text>
  <text x="1120" y="244" font-size="18" text-anchor="middle" fill="#1f2328">g(Y) = 1  (Pass)       g(Y) = 0  (Fail)</text>

