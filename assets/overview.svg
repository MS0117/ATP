  <text x="1160" y="326" font-size="20" font-weight="700" text-anchor="middle" fill="#1f2328">Process Reward (tactic-level)</text>
  <text x="1160" y="352" font-size="16" text-anchor="middle" fill="#30363d">parsed tactics with first-error propagation</text>
  <text x="1160" y="376" font-size="15" text-anchor="middle" fill="#30363d">first error → every later step is treated as wrong</text>

