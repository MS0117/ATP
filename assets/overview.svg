  <rect x="648" y="22" width="158" height="100" rx="12" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <path d="M 674 42 L 710 98 L 746 46 L 782 94" fill="none" stroke="#1f2328" stroke-width="2.5" stroke-linejoin="round"/>
