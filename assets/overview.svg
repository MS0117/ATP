  <text x="1387" y="56" font-size="21" font-weight="700" text-anchor="middle" fill="#1f2328">Combined Advantage</text>
  <text x="1387" y="96" font-size="19" text-anchor="middle" fill="#1f2328">A_outcome + α · A_process</text>

